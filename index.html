<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Calc - Hesap Makinesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <!-- Header -->
        <header class="calculator-header">
            <div class="header-branding">
                <span class="material-symbols-outlined header-icon">calculate</span>
                <h2 class="header-title">Pro Calc</h2>
            </div>
            <button class="btn-settings" data-action="settings" aria-label="Ayarlar">
                <span class="material-symbols-outlined">settings</span>
            </button>
        </header>

        <!-- Display Area -->
        <div class="display">
            <div class="display-operation" id="operation"></div>
            <div class="display-result" id="result">0</div>
        </div>

        <!-- Buttons Grid -->
        <div class="buttons">
            <!-- Row 1: Function Keys -->
            <button class="btn btn-function" data-action="clear" aria-label="Temizle">
                <span class="material-symbols-outlined">restart_alt</span>
            </button>
            <button class="btn btn-function" data-action="backspace" aria-label="Geri Sil">
                <span class="material-symbols-outlined">backspace</span>
            </button>
            <button class="btn btn-operator" data-action="percent" aria-label="Yüzde">
                <span class="material-symbols-outlined">percent</span>
            </button>
            <button class="btn btn-operator" data-action="divide" aria-label="Böl">
                <span class="material-symbols-outlined">close</span>
            </button>

            <!-- Row 2: Numbers + Operator -->
            <button class="btn btn-number" data-value="7">7</button>
            <button class="btn btn-number" data-value="8">8</button>
            <button class="btn btn-number" data-value="9">9</button>
            <button class="btn btn-operator" data-action="multiply" aria-label="Çarp">
                <span class="material-symbols-outlined">remove</span>
            </button>

            <!-- Row 3: Numbers + Operator -->
            <button class="btn btn-number" data-value="4">4</button>
            <button class="btn btn-number" data-value="5">5</button>
            <button class="btn btn-number" data-value="6">6</button>
            <button class="btn btn-operator" data-action="subtract" aria-label="Çıkar">
                <span class="material-symbols-outlined">remove</span>
            </button>

            <!-- Row 4: Numbers + Operator -->
            <button class="btn btn-number" data-value="1">1</button>
            <button class="btn btn-number" data-value="2">2</button>
            <button class="btn btn-number" data-value="3">3</button>
            <button class="btn btn-operator" data-action="add" aria-label="Topla">
                <span class="material-symbols-outlined">add</span>
            </button>

            <!-- Row 5: Bottom Keys -->
            <button class="btn btn-function" data-action="toggle-sign" aria-label="İşaret Değiştir">±</button>
            <button class="btn btn-number" data-value="0">0</button>
            <button class="btn btn-function" data-action="decimal" aria-label="Nokta">.</button>
            <button class="btn btn-equals" data-action="equals" aria-label="Hesapla">
                <span class="material-symbols-outlined">drag_handle</span>
            </button>
        </div>

        <!-- Footer Stats -->
        <footer class="calculator-footer">
            <span class="memory-status" id="memory-status">Memory: 0.00</span>
            <div class="connection-status">
                <div class="connection-dot"></div>
                <span>Connected</span>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
